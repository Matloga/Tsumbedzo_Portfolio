<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="160" cy="120" r="50" fill="#fca311"/>
  <circle cx="160" cy="120" r="50" fill="none" stroke="#fca311" stroke-width="6" opacity="0.5" stroke-dasharray="8 14"/>
  <!-- cloud -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="330" cy="120" rx="70" ry="34"/>
    <ellipse cx="280" cy="105" rx="40" ry="28"/>
    <ellipse cx="385" cy="108" rx="38" ry="26"/>
  </g>
  <!-- rain -->
  <line x1="260" y1="210" x2="245" y2="250" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="315" y1="210" x2="300" y2="250" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="370" y1="210" x2="355" y2="250" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="420" y1="220" x2="405" y2="260" stroke="#7ec8ff" stroke-width="7" stroke-linecap="round"/>
  <text x="300" y="345" font-family="Raleway, Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="3">WEATHER APP</text>
</svg>
